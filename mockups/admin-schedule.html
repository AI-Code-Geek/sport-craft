<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Schedule — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-3">Schedule generator</h4>
    <div class="row g-3">
      <div class="col-12 col-lg-4">
        <div class="card card-vb">
          <div class="card-header">Configuration</div>
          <div class="card-body">
            <label class="form-label small muted">Algorithm</label>
            <select class="form-select mb-3">
              <option selected>Single round robin</option>
              <option>Double round robin</option>
              <option>Manual</option>
            </select>
            <label class="form-label small muted">Venue</label>
            <input class="form-control mb-3" value="Estancia Community Gym">
            <label class="form-label small muted">Courts</label>
            <input class="form-control mb-3" value="Court A, Court B">
            <label class="form-label small muted">Game days</label>
            <input class="form-control mb-3" value="Sun 6:00pm, Sun 7:15pm">
            <button class="btn btn-primary w-100 mb-2" onclick="alert('Preview regenerated (demo) — 15 matches for 6 teams.')">Generate preview</button>
            <button class="btn btn-outline-primary w-100" onclick="alert('Schedule published (demo).')">Publish schedule →</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="card card-vb">
          <div class="card-header">Preview — <span id="count"></span> matches</div>
          <div class="table-responsive">
            <table class="table mb-0 align-middle">
              <thead><tr><th>#</th><th>Date &amp; time</th><th>Matchup</th><th>Court</th><th>Status</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-schedule');
    const S = VB.S;
    const groupMatches = S.matches.filter(m => m.round === 'group').sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
    document.getElementById('count').textContent = groupMatches.length;
    document.getElementById('rows').innerHTML = groupMatches.map((m, i) => `
      <tr>
        <td class="muted">${i + 1}</td>
        <td class="small">${VB.fmt.datetime(m.scheduled_at)}</td>
        <td>${VB.teamChip(m.team_a_id, { link: false })} <span class="muted small">vs</span> ${VB.teamChip(m.team_b_id, { link: false })}</td>
        <td class="small muted">${m.court}</td>
        <td>${VB.statusBadge(m.status)}</td>
      </tr>`).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
