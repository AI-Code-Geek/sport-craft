<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poll — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-3">Season signup poll</h4>

    <div class="row g-3 mb-3">
      <div class="col-12 col-md-7">
        <div class="card card-vb h-100">
          <div class="card-header">Capacity</div>
          <div class="card-body">
            <div class="d-flex justify-content-between mb-1">
              <span class="stat" id="confirmed-count"></span>
              <span class="muted" id="capacity-label"></span>
            </div>
            <div id="capacity-meter"></div>
            <div class="muted small mt-2" id="waitlist-note"></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-5">
        <div class="card card-vb h-100">
          <div class="card-header">Your status</div>
          <div class="card-body" id="my-status"></div>
        </div>
      </div>
    </div>

    <div class="card card-vb">
      <div class="card-header">Confirmed &amp; waitlisted (in signup order)</div>
      <div class="table-responsive">
        <table class="table mb-0 align-middle">
          <thead><tr><th>#</th><th>Player</th><th>Signed up</th><th>Status</th></tr></thead>
          <tbody id="entry-rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('poll');
    const S = VB.S, t = S.tournament;
    const entries = S.poll.entries.slice().sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));
    const confirmed = entries.filter(e => e.status === 'confirmed');
    const waitlisted = entries.filter(e => e.status === 'waitlisted');

    document.getElementById('confirmed-count').textContent = confirmed.length + ' / ' + S.poll.capacity;
    document.getElementById('capacity-label').textContent = t.max_teams + ' teams × ' + t.team_size + ' players';
    document.getElementById('capacity-meter').innerHTML = VB.meter(100 * confirmed.length / S.poll.capacity);
    document.getElementById('waitlist-note').textContent = waitlisted.length
      ? waitlisted.length + ' on the waitlist — promoted in order if someone withdraws.'
      : 'No one on the waitlist yet.';

    const rows = entries.map((e, i) => `
      <tr class="entry-row">
        <td class="muted">${i + 1}</td>
        <td>${VB.userName(e.user_id)}</td>
        <td class="muted small">${VB.fmt.datetime(e.submitted_at)}</td>
        <td>${VB.statusBadge(e.status)}</td>
      </tr>`).join('');
    document.getElementById('entry-rows').innerHTML = rows;

    const myEntry = VB.myPollEntry();
    const statusEl = document.getElementById('my-status');
    function renderStatus() {
      const e = VB.myPollEntry();
      if (!e || e.status === 'withdrawn') {
        statusEl.innerHTML = `<p class="muted">You haven't joined this poll yet.</p>
          <button class="btn btn-primary w-100" onclick="VB.joinPoll();renderStatus();">Join the poll →</button>`;
      } else {
        statusEl.innerHTML = `<p>${VB.statusBadge(e.status)}</p>
          <p class="muted small">Signed up ${VB.fmt.datetime(e.submitted_at)}</p>
          <button class="btn btn-outline-danger btn-sm" onclick="VB.withdrawFromPoll();renderStatus();">Withdraw</button>`;
      }
    }
    renderStatus();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
