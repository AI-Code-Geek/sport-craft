<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3 gap-2">
      <div>
        <h4 class="mb-0" id="tname"></h4>
        <div class="muted small" id="tsub"></div>
      </div>
      <span class="badge-status st-active" id="tstatus"></span>
    </div>

    <div class="card card-vb mb-3">
      <div class="card-header">Tournament progress</div>
      <div class="card-body" id="stepper"></div>
    </div>

    <div class="row g-3 mb-3">
      <div class="col-12 col-md-7">
        <div class="card card-vb h-100">
          <div class="card-header">Your next action</div>
          <div class="card-body" id="next-action"></div>
        </div>
      </div>
      <div class="col-12 col-md-5">
        <div class="card card-vb h-100">
          <div class="card-header">Your team</div>
          <div class="card-body" id="my-team-card"></div>
        </div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-6 col-md-3">
        <a href="schedule.html" class="text-decoration-none">
          <div class="card card-vb text-center p-3"><div class="stat">🗓️</div><div class="small mt-1">Schedule</div></div>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="standings.html" class="text-decoration-none">
          <div class="card card-vb text-center p-3"><div class="stat">📊</div><div class="small mt-1">Standings</div></div>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="bracket.html" class="text-decoration-none">
          <div class="card card-vb text-center p-3"><div class="stat">🏆</div><div class="small mt-1">Bracket</div></div>
        </a>
      </div>
      <div class="col-6 col-md-3">
        <a href="teams.html" class="text-decoration-none">
          <div class="card card-vb text-center p-3"><div class="stat">👥</div><div class="small mt-1">All Teams</div></div>
        </a>
      </div>
    </div>

  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('home');
    const S = VB.S, t = S.tournament;

    document.getElementById('tname').textContent = t.name;
    document.getElementById('tsub').textContent = S.community.name;
    document.getElementById('tstatus').textContent = t.status.replace(/_/g, ' ');
    document.getElementById('tstatus').className = 'badge-status st-active';
    document.getElementById('stepper').innerHTML = VB.lifecycleStepper();

    const role = VB.role(), me = VB.currentUser();
    const nextEl = document.getElementById('next-action');
    if (role === 'player' || role === 'captain') {
      const entry = VB.myPollEntry();
      if (t.status.startsWith('poll') && !entry) {
        nextEl.innerHTML = `<p>The poll is open — grab one of the remaining spots before it fills up.</p>
          <a href="poll.html" class="btn btn-primary">Vote in the poll →</a>`;
      } else if (entry && entry.status !== 'withdrawn') {
        nextEl.innerHTML = `<p>You're on the roster pool: ${VB.statusBadge(entry.status)}.</p>
          <a href="poll.html" class="btn btn-outline-primary">View poll status →</a>`;
      } else {
        const live = S.matches.find(m => m.status === 'live');
        if (live) {
          nextEl.innerHTML = `<p><span class="live-dot"></span>A match is live right now: ${VB.teamName(live.team_a_id)} vs ${VB.teamName(live.team_b_id)}.</p>
            <a href="scoreboard.html#${live.id}" class="btn btn-danger">Watch live →</a>`;
        } else {
          nextEl.innerHTML = `<p>Check the schedule for your team's next match.</p>
            <a href="schedule.html" class="btn btn-outline-primary">View schedule →</a>`;
        }
      }
      if (role === 'captain') {
        nextEl.innerHTML += `<hr><p class="mb-2">The live auction needs your bids for open roster positions.</p>
          <a href="auction.html" class="btn btn-warning">Go to auction →</a>`;
      }
    } else {
      nextEl.innerHTML = `<p>You're running this tournament as ${VB.roleLabel(role)}. Jump into the admin console to
        advance the next stage.</p>
        <a href="admin-home.html" class="btn btn-primary">Open admin console →</a>`;
    }

    const teamEl = document.getElementById('my-team-card');
    const myTeam = VB.myTeam();
    if (myTeam) {
      teamEl.innerHTML = `<div class="d-flex align-items-center gap-2 mb-2">${VB.teamChip(myTeam.id)}</div>
        <div class="small muted">Captain: ${VB.userName(myTeam.captain_user_id)}</div>
        <div class="small muted mb-2">Roster: ${myTeam.roster.length}/${t.team_size}</div>
        <a href="my-team.html" class="btn btn-sm btn-outline-primary">View roster →</a>`;
    } else {
      teamEl.innerHTML = `<p class="muted mb-0">You're not on a team yet — teams form after the poll closes and captains run the auction.</p>`;
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
