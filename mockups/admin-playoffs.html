<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Playoffs — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-3">Playoff configuration</h4>
    <div class="row g-3 mb-3">
      <div class="col-12 col-lg-4">
        <div class="card card-vb">
          <div class="card-header">Cutoff</div>
          <div class="card-body">
            <label class="form-label small muted">Teams advancing</label>
            <select class="form-select mb-3" id="cutoff">
              <option>2</option><option selected>4</option><option>6</option>
            </select>
            <p class="muted small" id="progress-note"></p>
            <button class="btn btn-primary w-100" onclick="alert('Bracket generated from current standings (demo).')">Generate bracket →</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-8">
        <div class="card card-vb">
          <div class="card-header">Standings (seed order)</div>
          <div class="table-responsive">
            <table class="table mb-0 align-middle">
              <thead><tr><th>Seed</th><th>Team</th><th class="text-end">League pts</th><th class="text-end">Sets</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="card card-vb">
      <div class="card-header">Bracket preview</div>
      <div class="bracket p-3" id="bracket"></div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-playoffs');
    const S = VB.S, t = S.tournament, B = S.bracket;
    const groupMatches = S.matches.filter(m => m.round === 'group');
    const remaining = groupMatches.filter(m => m.status !== 'completed').length;
    document.getElementById('progress-note').textContent = remaining
      ? `${remaining} group-stage match${remaining === 1 ? '' : 'es'} still to play — bracket below is a provisional preview.`
      : 'Group stage complete — ready to lock the bracket.';

    const sorted = S.standings.slice().sort((a, b) => a.rank - b.rank);
    document.getElementById('rows').innerHTML = sorted.map(s => `
      <tr class="${s.rank <= t.playoff_team_count ? '' : 'text-muted'}">
        <td class="mono">${s.rank}</td>
        <td>${VB.teamChip(s.team_id)}</td>
        <td class="text-end mono">${s.league_points}</td>
        <td class="text-end mono">${s.sets_won}-${s.sets_lost}</td>
      </tr>`).join('');

    function teamCell(teamId, seed) {
      return teamId ? `<div class="bm-team">${VB.teamChip(teamId, { link: false })}</div>` : `<div class="bm-team muted">TBD${seed ? ' (#' + seed + ')' : ''}</div>`;
    }
    document.getElementById('bracket').innerHTML = B.rounds.map(round => `
      <div class="bracket-round">
        <div class="bracket-round-label">${round.name}</div>
        ${round.matches.map(m => `
          <div class="bracket-match">${teamCell(m.team_a_id, m.seed_a)}${teamCell(m.team_b_id, m.seed_b)}</div>
          <div class="text-center muted small mb-2">${m.scheduled_at ? VB.fmt.datetime(m.scheduled_at) : ''}</div>`).join('')}
      </div>`).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
