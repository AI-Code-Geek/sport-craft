<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Positions — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-1">Categorize players by position</h4>
    <p class="muted small mb-3">Sort every remaining confirmed player into one skill category per roster slot. Each
      category needs exactly <span id="target-n"></span> players (one per team) before the auction can start.</p>

    <div class="row g-3">
      <div class="col-12 col-lg-8">
        <div class="card card-vb">
          <div class="card-header">Remaining confirmed players</div>
          <div class="table-responsive">
            <table class="table mb-0 align-middle">
              <thead><tr><th>Player</th><th>Position category</th></tr></thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-4">
        <div class="card card-vb mb-3">
          <div class="card-header">Bucket status</div>
          <div class="card-body" id="buckets"></div>
        </div>
        <button class="btn btn-primary w-100" id="start-btn" onclick="alert('All buckets full — starting the auction (demo).')">Start auction →</button>
      </div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-positions');
    const S = VB.S, t = S.tournament;
    document.getElementById('target-n').textContent = t.max_teams;

    // flatten positionPool into a per-user assignment map (this is the committee's pre-auction bucketing)
    const assignment = {}; // user_id -> position
    S.positions.forEach(pos => S.positionPool[pos].forEach(p => assignment[p.user_id] = pos));
    const allPlayers = Object.keys(assignment);

    function renderRows() {
      document.getElementById('rows').innerHTML = allPlayers.map(uid => `
        <tr>
          <td>${VB.userName(uid)}</td>
          <td>
            <select class="form-select form-select-sm" style="max-width:220px" onchange="assignment['${uid}']=this.value;renderBuckets();">
              ${S.positions.map(p => `<option value="${p}" ${assignment[uid] === p ? 'selected' : ''}>${p}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('');
    }

    function renderBuckets() {
      const counts = Object.fromEntries(S.positions.map(p => [p, 0]));
      Object.values(assignment).forEach(p => counts[p]++);
      const allFull = S.positions.every(p => counts[p] === t.max_teams);
      document.getElementById('buckets').innerHTML = S.positions.map(p => {
        const n = counts[p], full = n === t.max_teams;
        return `<div class="d-flex justify-content-between align-items-center mb-2">
          <span>${p}</span>
          <span class="fw-bold ${full ? 'text-success' : 'text-warning'}">${n} / ${t.max_teams} ${full ? '✓' : ''}</span>
        </div>${VB.meter(100 * n / t.max_teams, true)}`;
      }).join('');
      document.getElementById('start-btn').disabled = !allFull;
    }

    renderRows();
    renderBuckets();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
