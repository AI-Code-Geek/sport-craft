<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Schedule — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-3">Match schedule</h4>

    <div class="d-flex flex-wrap gap-2 mb-3">
      <select id="filter-team" class="form-select form-select-sm w-auto"></select>
      <select id="filter-round" class="form-select form-select-sm w-auto">
        <option value="">All rounds</option>
        <option value="group">Group stage</option>
        <option value="semifinal">Semifinal</option>
        <option value="final">Final</option>
      </select>
      <select id="filter-status" class="form-select form-select-sm w-auto">
        <option value="">All statuses</option>
        <option value="live">Live</option>
        <option value="scheduled">Scheduled</option>
        <option value="completed">Completed</option>
      </select>
    </div>

    <div class="card card-vb">
      <div class="table-responsive">
        <table class="table mb-0 align-middle">
          <thead><tr><th>Date &amp; time</th><th>Matchup</th><th>Venue</th><th>Status</th><th class="text-end">Score</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('schedule');
    const S = VB.S;

    const teamSel = document.getElementById('filter-team');
    teamSel.innerHTML = '<option value="">All teams</option>' + S.teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');

    function render() {
      const teamF = teamSel.value, roundF = document.getElementById('filter-round').value, statusF = document.getElementById('filter-status').value;
      const list = S.matches
        .filter(m => !teamF || m.team_a_id === teamF || m.team_b_id === teamF)
        .filter(m => !roundF || m.round === roundF)
        .filter(m => !statusF || m.status === statusF)
        .slice().sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

      document.getElementById('rows').innerHTML = list.map(m => `
        <tr class="match-row" onclick="location.href='scoreboard.html#${m.id}'">
          <td class="small">${VB.fmt.datetime(m.scheduled_at)}</td>
          <td>${VB.teamChip(m.team_a_id, { link: false })} <span class="muted small">vs</span> ${VB.teamChip(m.team_b_id, { link: false })}</td>
          <td class="small muted">${m.venue} · ${m.court}</td>
          <td>${VB.statusBadge(m.status)}</td>
          <td class="text-end mono">${m.status === 'completed' || m.status === 'live' ? VB.matchScoreLabel(m) : '—'}</td>
        </tr>`).join('') || '<tr><td colspan="5" class="text-center muted py-4">No matches match these filters.</td></tr>';
    }
    ['filter-team', 'filter-round', 'filter-status'].forEach(id => document.getElementById(id).addEventListener('change', render));
    render();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
