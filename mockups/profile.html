<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-3">Your profile</h4>
    <div class="row g-3">
      <div class="col-12 col-md-6">
        <div class="card card-vb">
          <div class="card-header">Account</div>
          <div class="card-body" id="account"></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="card card-vb">
          <div class="card-header">Notification preferences</div>
          <div class="card-body">
            <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" checked id="n1"><label class="form-check-label" for="n1">Poll opens / closing soon</label></div>
            <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" checked id="n2"><label class="form-check-label" for="n2">My team's matches</label></div>
            <div class="form-check form-switch mb-2"><input class="form-check-input" type="checkbox" id="n3"><label class="form-check-label" for="n3">All league scores</label></div>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" checked id="n4"><label class="form-check-label" for="n4">Auction — my turn to bid</label></div>
            <button class="btn btn-sm btn-outline-primary mt-3" onclick="alert('Saved (demo).')">Save preferences</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('profile');
    const me = VB.currentUser();
    document.getElementById('account').innerHTML = `
      <div class="d-flex align-items-center gap-3 mb-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:56px;height:56px;background:var(--surface-2);border:1px solid var(--border)">${VB.fmt.initials(me.name)}</div>
        <div>
          <div class="fw-bold">${me.name}</div>
          <div class="muted small">${me.email}</div>
        </div>
      </div>
      <div class="mb-2">${VB.roleBadge(VB.role())}</div>
      <div class="muted small mb-3">Community: ${VB.S.community.name}</div>
      <button class="btn btn-sm btn-outline-secondary">Change password</button>`;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
