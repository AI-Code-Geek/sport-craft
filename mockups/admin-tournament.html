<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tournament Settings — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-3">Tournament settings</h4>
    <div class="row g-3">
      <div class="col-12 col-lg-7">
        <div class="card card-vb">
          <div class="card-header">Variables</div>
          <div class="card-body" id="form"></div>
        </div>
      </div>
      <div class="col-12 col-lg-5">
        <div class="card card-vb">
          <div class="card-header">Status</div>
          <div class="card-body" id="status-card"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-tournament');
    const S = VB.S, t = S.tournament;
    const locked = t.status !== 'draft';

    document.getElementById('form').innerHTML = `
      <div class="mb-3"><label class="form-label small muted">Name</label><input class="form-control" value="${t.name}" ${locked ? 'disabled' : ''}></div>
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label small muted">Max teams</label><input type="number" class="form-control" value="${t.max_teams}" disabled></div>
        <div class="col-6"><label class="form-label small muted">Team size</label><input type="number" class="form-control" value="${t.team_size}" disabled></div>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label small muted">Auction budget</label><input type="number" class="form-control" value="${t.budget_points}" disabled></div>
        <div class="col-6"><label class="form-label small muted">Poll capacity</label><input type="number" class="form-control" value="${t.poll_capacity}" disabled></div>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-4"><label class="form-label small muted">Sets to win</label><input type="number" class="form-control" value="${t.sets_to_win}" ${locked ? 'disabled' : ''}></div>
        <div class="col-4"><label class="form-label small muted">Points/set</label><input type="number" class="form-control" value="${t.points_per_set}" ${locked ? 'disabled' : ''}></div>
        <div class="col-4"><label class="form-label small muted">Win by</label><input type="number" class="form-control" value="${t.win_by}" ${locked ? 'disabled' : ''}></div>
      </div>
      <div class="mb-3" style="max-width:200px"><label class="form-label small muted">Playoff team count</label><input type="number" class="form-control" value="${t.playoff_team_count}"></div>
      ${locked ? '<p class="muted small">Team-count / roster-size variables lock once the poll opens (they define the confirmed-player capacity).</p>' : ''}
      <button class="btn btn-primary" onclick="alert('Saved (demo).')">Save changes</button>`;

    document.getElementById('status-card').innerHTML = `
      <div class="mb-2">${VB.statusBadge(t.status)}</div>
      <div class="muted small mb-1">Poll opened: ${VB.fmt.datetime(t.poll_opened_at)}</div>
      <div class="muted small mb-3">Poll closed: ${VB.fmt.datetime(t.poll_closed_at)}</div>
      ${VB.lifecycleStepper()}`;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
