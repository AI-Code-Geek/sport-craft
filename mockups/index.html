<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Estancia Volleyball League — Sign in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <div class="text-center mt-4 mb-2"><span style="font-size:2rem">🏐</span></div>
    <div class="card card-vb gate-card shadow-sm">
      <div class="card-body p-4">
        <h3 class="mb-1">Estancia<span style="color:var(--brand)">VB</span></h3>
        <p class="muted mb-4">Community volleyball league — poll, teams, auction, schedule &amp; live scores.</p>

        <ul class="nav nav-pills mb-3" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#login-tab">Log in</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#join-tab">Join a community</button></li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="login-tab">
            <label class="form-label small muted">Email</label>
            <input id="email" class="form-control mb-2" placeholder="you@example.com" value="meera.success@gmail.com" />
            <label class="form-label small muted">Password</label>
            <input type="password" class="form-control mb-3" placeholder="••••••••" value="demo" />
            <button class="btn btn-primary w-100" onclick="login()">Sign in →</button>
            <p class="muted small mt-3 mb-0">Demo: any email/password works in this mockup.</p>
          </div>
          <div class="tab-pane fade" id="join-tab">
            <label class="form-label small muted">Your name</label>
            <input id="name" class="form-control mb-2" placeholder="Jane Doe" />
            <label class="form-label small muted">Email</label>
            <input class="form-control mb-2" placeholder="you@example.com" />
            <label class="form-label small muted">Community invite code</label>
            <input class="form-control mb-3 mono" placeholder="ESTANCIA-2026" value="ESTANCIA-2026" />
            <button class="btn btn-outline-primary w-100" onclick="login()">Create account &amp; join →</button>
          </div>
        </div>
      </div>
    </div>
    <p class="text-center muted small">Estancia Recreation Club &middot; Summer Volleyball League 2026</p>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    if (!localStorage.getItem("vb_role")) localStorage.setItem("vb_role", "player");
    function login() { location.href = "home.html"; }
  </script>
</body>
</html>
