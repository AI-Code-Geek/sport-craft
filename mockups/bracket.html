<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bracket — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-1">Playoff bracket</h4>
    <p class="muted small mb-3" id="note"></p>
    <div class="bracket" id="bracket"></div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('bracket');
    const S = VB.S, B = S.bracket;
    document.getElementById('note').textContent = B.provisional
      ? 'Provisional seeding from current standings — group stage still has matches remaining.'
      : 'Final seeding — group stage complete.';

    function teamCell(teamId, seed, winnerId) {
      const label = teamId ? VB.teamChip(teamId, { link: false }) : `<span class="muted">TBD${seed ? ' (#' + seed + ')' : ''}</span>`;
      const winCls = winnerId && winnerId === teamId ? 'winner' : '';
      return `<div class="bm-team ${winCls}">${label}</div>`;
    }

    document.getElementById('bracket').innerHTML = B.rounds.map(round => `
      <div class="bracket-round">
        <div class="bracket-round-label">${round.name}</div>
        ${round.matches.map(m => `
          <div class="bracket-match clickable" ${m.team_a_id && m.team_b_id ? `onclick="location.href='schedule.html'"` : ''}>
            ${teamCell(m.team_a_id, m.seed_a, m.winner_team_id)}
            ${teamCell(m.team_b_id, m.seed_b, m.winner_team_id)}
          </div>
          <div class="text-center muted small mb-2">${m.scheduled_at ? VB.fmt.datetime(m.scheduled_at) : ''} ${VB.statusBadge(m.status)}</div>
        `).join('')}
      </div>`).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
