<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Auction — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Auction control</h4>
      <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-secondary" onclick="alert('Auction paused (demo).')">Pause</button>
        <button class="btn btn-sm btn-outline-danger" onclick="alert('Forced current bid as SOLD (demo).')">Force-resolve</button>
      </div>
    </div>

    <div class="card card-vb mb-3">
      <div class="card-body py-2" id="round-tracker"></div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-lg-7">
        <div class="card card-vb mb-3">
          <div class="card-body nominee-card" id="nominee-card"></div>
        </div>
        <div class="card card-vb">
          <div class="card-header">Manual controls</div>
          <div class="card-body d-flex flex-wrap gap-2">
            <button class="btn btn-outline-primary" onclick="alert('Marked SOLD to current high bidder (demo).')">Mark sold →</button>
            <button class="btn btn-outline-secondary" onclick="alert('Skipped to next nominee (demo).')">Skip nominee</button>
            <button class="btn btn-outline-secondary" onclick="alert('Advanced to next position round (demo).')">Advance round</button>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-5">
        <div class="card card-vb mb-3">
          <div class="card-header">Team budgets</div>
          <div class="card-body budget-rail" id="budget-rail"></div>
        </div>
        <div class="card card-vb">
          <div class="card-header">Bid log</div>
          <div class="card-body auction-log" id="log"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-auction');
    const S = VB.S, A = S.auctionLive;

    document.getElementById('round-tracker').innerHTML = `<div class="stepper">` +
      A.roundsCompleted.map(r => `<div class="step done"><span class="step-label">${r}</span><span class="step-sub">complete</span></div>`).join('') +
      `<div class="step current"><span class="step-label">${A.currentRound}</span><span class="step-sub">live now</span></div>` +
      A.roundsRemaining.map(r => `<div class="step"><span class="step-label">${r}</span><span class="step-sub">queued</span></div>`).join('') +
      `</div>`;

    const bidTeam = S.teams.find(x => x.id === A.currentBid.team_id);
    document.getElementById('nominee-card').innerHTML = `
      <div class="muted text-uppercase small mb-1">${A.currentNominee.position} · on the block</div>
      <div class="nominee-name mb-2">${VB.userName(A.currentNominee.user_id)}</div>
      <div class="bid-amount">${A.currentBid.amount} pts</div>
      <div>${VB.teamChip(bidTeam.id, { link: false })} is high bidder</div>`;

    document.getElementById('budget-rail').innerHTML = A.teamState.map(ts => {
      const team = S.teams.find(x => x.id === ts.team_id);
      return `<div class="team-row">
        <span class="flex-grow-1">${VB.teamChip(team.id, { link: false })}</span>
        <span class="muted small">${ts.filled}/5 slots</span>
        <span class="mono fw-bold">${ts.budget_remaining} pts</span>
      </div>`;
    }).join('');

    document.getElementById('log').innerHTML = A.log.slice().reverse().map(l => `
      <div class="d-flex justify-content-between border-bottom py-1">
        <span>${VB.userName(l.user_id)} <span class="muted">(${l.position})</span></span>
        <span>${VB.teamChip(l.team_id, { link: false })} <span class="mono">${l.amount}</span>
        ${l.result === 'sold' ? '<span class="text-success small">sold</span>' : '<span class="text-warning small">bidding</span>'}</span>
      </div>`).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
