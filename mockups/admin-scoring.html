<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Scoring — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Live scoring console</h4>
      <select id="match-picker" class="form-select form-select-sm w-auto"></select>
    </div>
    <div id="content"></div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-scoring');
    const S = VB.S;
    const scoreable = S.matches.filter(m => m.status === 'live' || m.status === 'scheduled')
      .sort((a, b) => (a.status === 'live' ? -1 : 1) - (b.status === 'live' ? -1 : 1));
    const picker = document.getElementById('match-picker');
    picker.innerHTML = scoreable.map(m => `<option value="${m.id}">${VB.teamName(m.team_a_id)} vs ${VB.teamName(m.team_b_id)} ${m.status === 'live' ? '· LIVE' : ''}</option>`).join('');

    let state = null;
    function loadMatch(id) {
      const m = S.matches.find(x => x.id === id);
      state = JSON.parse(JSON.stringify(m));
      if (!state.sets.length) state.sets = [{ set_number: 1, a: 0, b: 0, status: 'in_progress' }];
      render();
    }

    function point(side) {
      const cur = state.sets[state.sets.length - 1];
      if (cur.status !== 'in_progress') return;
      cur[side]++;
      const t = S.tournament;
      if ((cur.a >= t.points_per_set || cur.b >= t.points_per_set) && Math.abs(cur.a - cur.b) >= t.win_by) {
        cur.status = 'completed';
      }
      render();
    }
    function undo(side) {
      const cur = state.sets[state.sets.length - 1];
      if (cur[side] > 0) cur[side]--;
      render();
    }
    function nextSet() {
      const setsWonA = state.sets.filter(s => s.status === 'completed' && s.a > s.b).length;
      const setsWonB = state.sets.filter(s => s.status === 'completed' && s.b > s.a).length;
      if (Math.max(setsWonA, setsWonB) >= S.tournament.sets_to_win) { alert('Match already decided — end match instead.'); return; }
      state.sets.push({ set_number: state.sets.length + 1, a: 0, b: 0, status: 'in_progress' });
      render();
    }
    function endMatch() {
      state.status = 'completed';
      alert('Match marked complete — standings recomputed (demo).');
      render();
    }

    function render() {
      const m = state, t = S.tournament;
      const cur = m.sets[m.sets.length - 1];
      const setsWonA = m.sets.filter(s => s.status === 'completed' && s.a > s.b).length;
      const setsWonB = m.sets.filter(s => s.status === 'completed' && s.b > s.a).length;
      document.getElementById('content').innerHTML = `
      <div class="row g-3">
        <div class="col-12 col-lg-8">
          <div class="card card-vb mb-3">
            <div class="card-body">
              <div class="text-center muted small mb-2">${m.round} · ${VB.fmt.datetime(m.scheduled_at)} · ${m.venue} ${m.court}</div>
              <div class="row align-items-center">
                <div class="col-5 text-center">
                  <div class="fs-5 mb-2">${VB.teamChip(m.team_a_id, { link: false })}</div>
                  <div class="score-big mono">${cur.a}</div>
                  <div class="d-flex justify-content-center gap-2 mt-2">
                    <button class="btn btn-outline-secondary btn-sm" onclick="undo('a')">−1</button>
                    <button class="btn btn-primary" onclick="point('a')">+1</button>
                  </div>
                </div>
                <div class="col-2 text-center">
                  <div class="stat">${setsWonA}–${setsWonB}</div>
                  <div class="muted small">sets · set ${cur.set_number}</div>
                </div>
                <div class="col-5 text-center">
                  <div class="fs-5 mb-2">${VB.teamChip(m.team_b_id, { link: false })}</div>
                  <div class="score-big mono">${cur.b}</div>
                  <div class="d-flex justify-content-center gap-2 mt-2">
                    <button class="btn btn-primary" onclick="point('b')">+1</button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="undo('b')">−1</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" ${cur.status === 'in_progress' ? 'disabled' : ''} onclick="nextSet()">Start next set</button>
            <button class="btn btn-outline-danger" onclick="endMatch()">End match</button>
          </div>
        </div>
        <div class="col-12 col-lg-4">
          <div class="card card-vb">
            <div class="card-header">Sets so far</div>
            <div class="card-body d-flex flex-wrap gap-3 justify-content-center">
              ${m.sets.map(s => `<div class="text-center"><div class="muted small">Set ${s.set_number}</div>
                <div class="set-pill ${s.status === 'completed' && s.a > s.b ? 'won' : ''}">${s.a}</div>
                <div class="set-pill ${s.status === 'completed' && s.b > s.a ? 'won' : ''}">${s.b}</div></div>`).join('')}
            </div>
          </div>
        </div>
      </div>`;
    }

    picker.addEventListener('change', () => loadMatch(picker.value));
    loadMatch(picker.value);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
