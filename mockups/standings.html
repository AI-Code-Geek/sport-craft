<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Standings — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-1">League standings</h4>
    <p class="muted small mb-3" id="cutoff-note"></p>

    <div class="card card-vb">
      <div class="table-responsive">
        <table class="table mb-0 align-middle">
          <thead>
            <tr>
              <th>#</th><th>Team</th><th class="text-end">P</th><th class="text-end">W</th><th class="text-end">L</th>
              <th class="text-end">Sets</th><th class="text-end">Pts For</th><th class="text-end">Pts Against</th><th class="text-end">League Pts</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <p class="muted small mt-2">Tie-break order: league points → set ratio → head-to-head → point differential.</p>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('standings');
    const S = VB.S, t = S.tournament;
    document.getElementById('cutoff-note').textContent = `Top ${t.playoff_team_count} advance to the playoffs.`;

    const sorted = S.standings.slice().sort((a, b) => a.rank - b.rank);
    document.getElementById('rows').innerHTML = sorted.map(s => {
      const row = `
      <tr class="${s.rank === t.playoff_team_count ? 'table-warning' : ''}">
        <td class="mono">${s.rank}</td>
        <td>${VB.teamChip(s.team_id)}</td>
        <td class="text-end mono">${s.played}</td>
        <td class="text-end mono">${s.won}</td>
        <td class="text-end mono">${s.lost}</td>
        <td class="text-end mono">${s.sets_won}-${s.sets_lost}</td>
        <td class="text-end mono">${s.points_for}</td>
        <td class="text-end mono">${s.points_against}</td>
        <td class="text-end mono fw-bold">${s.league_points}</td>
      </tr>`;
      const divider = s.rank === t.playoff_team_count
        ? `<tr><td colspan="9" class="text-center small muted py-1">— playoff cutoff line (top ${t.playoff_team_count}) —</td></tr>` : '';
      return row + divider;
    }).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
