<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scoreboard — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Scoreboard</h4>
      <select id="match-picker" class="form-select form-select-sm w-auto"></select>
    </div>
    <div id="content"></div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('schedule');
    const S = VB.S;
    const sorted = S.matches.slice().sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
    const picker = document.getElementById('match-picker');
    picker.innerHTML = sorted.map(m => `<option value="${m.id}">${VB.teamName(m.team_a_id)} vs ${VB.teamName(m.team_b_id)} — ${VB.fmt.date(m.scheduled_at)}</option>`).join('');

    function currentId() {
      const hash = location.hash.replace('#', '');
      if (hash && S.matches.some(m => m.id === hash)) return hash;
      const live = S.matches.find(m => m.status === 'live');
      return (live || sorted[0]).id;
    }
    picker.value = currentId();
    picker.addEventListener('change', () => { location.hash = picker.value; render(); });
    window.addEventListener('hashchange', () => { picker.value = currentId(); render(); });

    function render() {
      const m = S.matches.find(x => x.id === currentId());
      const el = document.getElementById('content');
      const setRows = m.sets.map(s => `
        <div class="text-center">
          <div class="muted small mb-1">Set ${s.set_number}</div>
          <div class="set-pill ${s.status === 'completed' && s.a > s.b ? 'won' : ''}">${s.a}</div>
          <div class="set-pill ${s.status === 'completed' && s.b > s.a ? 'won' : ''}">${s.b}</div>
          ${s.status === 'in_progress' ? '<div class="text-danger small mt-1">live</div>' : ''}
        </div>`).join('');

      el.innerHTML = `
      <div class="card card-vb mb-3">
        <div class="card-body text-center py-4">
          <div class="mb-2">${VB.statusBadge(m.status)} <span class="muted small ms-2">${m.round} · ${VB.fmt.datetime(m.scheduled_at)} · ${m.venue} ${m.court}</span></div>
          <div class="row align-items-center">
            <div class="col-5 text-end"><div class="fs-5">${VB.teamChip(m.team_a_id)}</div></div>
            <div class="col-2"><div class="score-big mono">${VB.matchScoreLabel(m)}</div><div class="muted small">sets</div></div>
            <div class="col-5 text-start"><div class="fs-5">${VB.teamChip(m.team_b_id)}</div></div>
          </div>
        </div>
      </div>
      <div class="card card-vb">
        <div class="card-header">Set-by-set</div>
        <div class="card-body d-flex flex-wrap gap-4 justify-content-center">
          ${setRows || '<span class="muted">Not started yet.</span>'}
        </div>
      </div>
      ${m.status === 'live' ? '<p class="muted small text-center mt-3">Live scores refresh automatically every few seconds during play.</p>' : ''}`;
    }
    render();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
