<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Captains — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <h4 class="mb-1">Pick captains &amp; name teams</h4>
    <p class="muted small mb-3">Choose one captain per team from the confirmed pool, then give each team a name. Each captain starts with <span id="budget-n"></span> auction points.</p>
    <div class="row g-3" id="team-cards"></div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-captains');
    const S = VB.S, t = S.tournament;
    document.getElementById('budget-n').textContent = t.budget_points + ' pts';
    const confirmed = S.poll.entries.filter(e => e.status === 'confirmed').map(e => e.user_id);

    document.getElementById('team-cards').innerHTML = S.teams.map((team, i) => `
      <div class="col-12 col-md-6 col-xl-4">
        <div class="card card-vb h-100">
          <div class="card-header">Team ${i + 1}</div>
          <div class="card-body">
            <label class="form-label small muted">Team name</label>
            <input class="form-control mb-2" value="${team.name}">
            <label class="form-label small muted">Captain</label>
            <select class="form-select mb-2">
              ${confirmed.map(uid => `<option value="${uid}" ${uid === team.captain_user_id ? 'selected' : ''}>${VB.userName(uid)}</option>`).join('')}
            </select>
            <div class="d-flex justify-content-between align-items-center">
              <span class="team-chip"><span class="team-dot dot-${team.color}"></span>Color</span>
              <span class="muted small mono">Budget: ${t.budget_points} pts</span>
            </div>
          </div>
        </div>
      </div>`).join('') + `
      <div class="col-12">
        <div class="card card-vb p-3 d-flex flex-row justify-content-between align-items-center">
          <span class="muted small">${confirmed.length} confirmed players available · ${S.teams.length} captains selected</span>
          <button class="btn btn-primary" onclick="alert('Captains confirmed — proceed to Positions (demo).')">Confirm captains →</button>
        </div>
      </div>`;
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
