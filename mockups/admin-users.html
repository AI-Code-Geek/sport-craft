<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Users — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Community members</h4>
      <input class="form-control form-control-sm w-auto" placeholder="Search members…">
    </div>
    <div class="card card-vb">
      <div class="table-responsive">
        <table class="table mb-0 align-middle">
          <thead><tr><th>Name</th><th>Email</th><th>Role</th><th class="text-end">Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <p class="muted small mt-2">Showing 15 of <span id="total-n"></span> community members.</p>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-users');
    const S = VB.S;
    document.getElementById('total-n').textContent = S.users.length;
    document.getElementById('rows').innerHTML = S.users.slice(0, 15).map(u => `
      <tr>
        <td>${u.name}</td>
        <td class="small muted">${u.email}</td>
        <td>${VB.roleBadge(u.role === 'admin' ? 'super_admin' : u.role)}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-secondary" onclick="alert('Role updated (demo).')">Change role</button>
          <button class="btn btn-sm btn-outline-danger" onclick="alert('Member suspended (demo).')">Suspend</button>
        </td>
      </tr>`).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
