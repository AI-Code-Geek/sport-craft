<!doctype html>
<html lang="en" data-theme="">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Estancia Volleyball</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="assets/app.css" rel="stylesheet" />
</head>
<body>
  <div id="nav-root"></div>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">Admin console</h4>
      <span id="role-note" class="muted small"></span>
    </div>

    <div class="card card-vb mb-3">
      <div class="card-header">Tournament progress</div>
      <div class="card-body" id="stepper"></div>
    </div>

    <div class="row g-3" id="tool-grid"></div>
  </div>

  <script src="assets/sample-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    VB.mountNav('admin-home');
    const S = VB.S;
    document.getElementById('stepper').innerHTML = VB.lifecycleStepper();
    document.getElementById('role-note').textContent = 'Signed in as ' + VB.roleLabel(VB.role());

    const superAdminTools = [
      ['admin-tournaments-new.html', '➕', 'New tournament', 'Create a tournament + core variables'],
      ['admin-organizers.html', '🧑‍💼', 'Organizers', 'Staff this tournament\'s committee'],
      ['admin-users.html', '🗂️', 'Users', 'Manage community members &amp; roles'],
    ];
    const organizerTools = [
      ['admin-tournament.html', '⚙️', 'Tournament settings', 'Edit variables'],
      ['admin-poll.html', '🗳️', 'Poll', 'Open / close / freeze signup'],
      ['admin-captains.html', '👑', 'Captains', 'Pick captains, name teams'],
      ['admin-positions.html', '🏷️', 'Positions', 'Categorize remaining players'],
      ['admin-auction.html', '🔨', 'Auction control', 'Run the live position auction'],
      ['admin-schedule.html', '🗓️', 'Schedule', 'Generate &amp; publish matches'],
      ['admin-scoring.html', '📟', 'Live scoring', 'Enter set scores'],
      ['admin-playoffs.html', '🏆', 'Playoffs', 'Set cutoff, generate bracket'],
    ];
    const tools = VB.isSuperAdmin() ? superAdminTools.concat(organizerTools) : organizerTools;

    document.getElementById('tool-grid').innerHTML = tools.map(([href, icon, label, sub]) => `
      <div class="col-6 col-md-4 col-xl-3">
        <a href="${href}" class="text-decoration-none">
          <div class="card card-vb h-100 p-3">
            <div class="fs-3 mb-1">${icon}</div>
            <div class="fw-bold">${label}</div>
            <div class="muted small">${sub}</div>
          </div>
        </a>
      </div>`).join('');
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
